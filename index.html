<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>MAX Security — Smart Protection</title>
<style>
:root{
 --bg:#050b14;--panel:#0b1422;--panel2:#0e1a2a;--line:#1b3048;
 --text:#f4f8ff;--muted:#8fa4ba;--blue:#1687ff;--cyan:#36d7ff;
 --green:#25e58c;--yellow:#ffc857;--red:#ff5d73;--purple:#9d7cff;
 --shadow:0 24px 70px rgba(0,0,0,.35);--radius:22px
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:
 radial-gradient(900px 500px at 70% -10%,rgba(22,135,255,.18),transparent 65%),
 radial-gradient(700px 450px at 0 40%,rgba(54,215,255,.08),transparent 65%),var(--bg);
 color:var(--text);font:14px Inter,Segoe UI,Arial,sans-serif}
button,a{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}
.sidebar{width:265px;position:fixed;left:0;top:0;bottom:0;padding:22px 15px;background:rgba(5,12,21,.88);
 border-right:1px solid rgba(91,142,190,.16);backdrop-filter:blur(18px);z-index:10}
.logo{display:flex;gap:12px;align-items:center;padding:8px 9px 24px}
.logo-mark{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;
 background:linear-gradient(145deg,#0d6fff,#27d7ff);box-shadow:0 0 35px rgba(22,135,255,.28);font-size:23px}
.logo strong{font-size:18px;letter-spacing:.4px}.logo span{color:var(--cyan)}
.tag{font-size:10px;color:var(--muted);margin-top:3px}
.tier{padding:15px;border:1px solid #21415e;background:linear-gradient(145deg,#102238,#0a1421);
 border-radius:17px;margin-bottom:18px}.tier .small{font-size:10px;color:var(--cyan);font-weight:800;letter-spacing:1px}
.nav{display:grid;gap:5px}.nav button{width:100%;border:0;background:transparent;color:#9db0c3;text-align:left;
 padding:11px 13px;border-radius:12px;transition:.18s}.nav button:hover{background:#102033;color:#fff}
.nav button.active{color:#fff;background:linear-gradient(90deg,#103d68,#0e253d);box-shadow:inset 3px 0 var(--blue)}
.side-bottom{position:absolute;left:15px;right:15px;bottom:18px}
.upgrade{width:100%;border:1px solid #286db1;background:linear-gradient(135deg,#0f5fb6,#116fcf);
 color:#fff;padding:12px;border-radius:12px;font-weight:800}
.main{margin-left:265px;width:calc(100% - 265px);padding:30px;max-width:1500px}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}
.top h1{margin:0;font-size:31px;letter-spacing:-.8px}.sub{color:var(--muted);margin-top:5px}
.version{border:1px solid #24425d;background:#0a1624;padding:8px 12px;border-radius:999px;color:#a9c0d6;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:17px}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}
.card{background:linear-gradient(145deg,rgba(13,25,40,.94),rgba(8,17,28,.96));border:1px solid rgba(87,132,171,.18);
 border-radius:var(--radius);padding:21px;box-shadow:var(--shadow);overflow:hidden}
.hero{min-height:190px;display:flex;align-items:center;justify-content:space-between;gap:25px;
 background:radial-gradient(circle at 15% 50%,rgba(37,229,140,.09),transparent 30%),linear-gradient(145deg,#102238,#091522)}
.status{display:flex;gap:16px;align-items:center}.shield{width:72px;height:72px;border-radius:23px;display:grid;place-items:center;
 background:linear-gradient(145deg,#103d2d,#0a2119);border:1px solid #23684a;box-shadow:0 0 45px rgba(37,229,140,.13);font-size:32px}
h2,h3{margin:0 0 7px}.green{color:var(--green)}.muted{color:var(--muted)}.blue{color:var(--blue)}.yellow{color:var(--yellow)}
.actions{display:flex;gap:9px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:12px;padding:12px 17px;font-weight:800}
.primary{background:linear-gradient(135deg,#1687ff,#35c8ff);color:white;box-shadow:0 12px 30px rgba(22,135,255,.2)}
.secondary{background:#142437;color:#dbe9f7;border:1px solid #28445f}.primary:hover,.secondary:hover,.upgrade:hover{transform:translateY(-1px);filter:brightness(1.06)}
.metric{font-size:30px;font-weight:900;margin:8px 0}.statline{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #182b3f}
.statline:last-child{border:0}.label{color:#91a7bc}.badge{font-size:10px;font-weight:900;letter-spacing:.7px;padding:6px 9px;border-radius:999px}
.badge.green{background:#0e3024;border:1px solid #1f674b}.badge.blue{background:#102c49;border:1px solid #285c8d}.badge.lock{background:#28203d;border:1px solid #56447e;color:#b9a6ff}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.section-head span{font-size:11px;color:var(--muted)}
.camera-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.camera{height:145px;border-radius:15px;position:relative;overflow:hidden;
 background:linear-gradient(135deg,#152b3e,#09131f);border:1px solid #213a51}.camera:before{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 30% 35%,rgba(54,215,255,.25),transparent 15%),linear-gradient(120deg,transparent 35%,rgba(255,255,255,.05) 36%,transparent 55%)}
.camera b,.camera small{position:absolute;left:11px;z-index:1}.camera b{bottom:28px}.camera small{bottom:10px;color:#70efad}
.activity{display:grid;gap:10px}.event{display:flex;gap:12px;padding:12px;border-radius:13px;background:#0b1827;border:1px solid #172c41}
.event i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#14324e;font-style:normal}
.plan{position:relative}.plan.pop{border-color:#267fd0;box-shadow:0 0 0 1px rgba(22,135,255,.18),var(--shadow)}.popular{position:absolute;right:15px;top:15px;background:#167ff0;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:900}
.price{font-size:34px;font-weight:900;margin:14px 0 5px}.price span{font-size:12px;color:var(--muted);font-weight:500}.checks{display:grid;gap:9px;margin:17px 0}.check{color:#b8c8d8}.check:before{content:"✓";color:var(--green);font-weight:900;margin-right:8px}
.input{width:100%;background:#08131f;border:1px solid #274057;color:#fff;border-radius:11px;padding:12px;outline:none}.input:focus{border-color:#298ce8}
.notice{margin-top:12px;padding:13px;border-radius:13px;background:#0b1725;border:1px solid #1b334a;color:#91a7bc;line-height:1.55}
footer{padding:28px 0 5px;text-align:center;color:#647b90;font-size:12px}
.mobile-toggle{display:none}
@media(max-width:1000px){.sidebar{width:225px}.main{margin-left:225px;width:calc(100% - 225px);padding:22px}.span8,.span6{grid-column:span 12}.span4{grid-column:span 6}}
@media(max-width:720px){.app{display:block}.sidebar{position:static;width:100%;padding:12px}.logo{padding-bottom:12px}.nav{grid-template-columns:repeat(3,1fr)}.side-bottom{display:none}.main{margin:0;width:100%;padding:15px}.top h1{font-size:25px}.hero{display:block}.hero .actions{margin-top:18px}.span4{grid-column:span 12}.camera-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="logo"><div class="logo-mark">M</div><div><strong>MAX <span>Security</span></strong><div class="tag">Powered by TriconX Technology</div></div></div>
 <div class="tier"><b>MAX Premium</b><div class="small">SMART PROTECTION</div><div class="tag">Your safety, our priority.</div></div>
 <nav class="nav" id="nav"></nav>
 <div class="side-bottom"><button class="upgrade" onclick="go('plans')">Upgrade Protection</button></div>
</aside>
<main class="main"><div id="content"></div><footer>MAX Security · Smart Protection · Real-Time Alerts · Total Peace of Mind</footer></main>
</div>

<script>
const pages={dashboard:"Dashboard",monitor:"Live Monitor",alerts:"Alerts",scan:"Scan Center",protection:"Protection",privacy:"Security & Privacy",plans:"Plans & Pricing",settings:"Settings"};
const nav=document.getElementById("nav"),content=document.getElementById("content");
let state={page:"dashboard",armed:true,scanCount:0,alerts:3,plan:"Free"};
Object.entries(pages).forEach(([id,label])=>{const b=document.createElement("button");b.textContent=label;b.dataset.id=id;b.onclick=()=>go(id);nav.appendChild(b)});
function go(id){state.page=id;({dashboard,monitor,alerts,scan,protection,privacy,plans,settings}[id]||dashboard)();nav.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.id===id))}
function top(title,sub){content.innerHTML=`<div class="top"><div><h1>${title}</h1><div class="sub">${sub}</div></div><span class="version">MAX Security Web · v2.0</span></div>`}
function card(c,cls=""){return `<div class="card ${cls}">${c}</div>`}
function dashboard(){
 top("Good evening, User","Here’s your MAX Security overview.");
 content.innerHTML+=`<div class="grid">
 ${card(`<div class="status"><div class="shield">🛡</div><div><div class="green" style="font-weight:900">SYSTEM ${state.armed?"PROTECTED":"PAUSED"}</div><h2>${state.armed?"Your devices are protected":"Protection is paused"}</h2><div class="muted">Real-time security and monitoring status</div></div></div><div class="actions"><button class="primary" onclick="go('scan')">RUN QUICK SCAN</button><button class="secondary" onclick="toggleArm()">${state.armed?"PAUSE PROTECTION":"ACTIVATE PROTECTION"}</button></div>`,"hero span12")}
 ${card(`<div class="section-head"><h3>Security health</h3><span>LIVE</span></div><div class="metric green">98%</div><div class="muted">Protection health score</div><div class="statline"><span class="label">Real-time Protection</span><b class="green">ACTIVE</b></div><div class="statline"><span class="label">Firewall</span><b class="green">ACTIVE</b></div><div class="statline"><span class="label">Web Guard</span><b class="green">ACTIVE</b></div>`,"span4")}
 ${card(`<div class="section-head"><h3>Quick stats</h3><span>TODAY</span></div><div class="statline"><span class="label">Files scanned</span><b>${state.scanCount*127}</b></div><div class="statline"><span class="label">Threats blocked</span><b class="green">0</b></div><div class="statline"><span class="label">Alerts</span><b class="yellow">${state.alerts}</b></div><div class="statline"><span class="label">Last scan</span><b>${state.scanCount?"Just now":"Not run"}</b></div>`,"span4")}
 ${card(`<div class="section-head"><h3>Recent activity</h3><button class="secondary" onclick="go('alerts')">View all</button></div><div class="activity"><div class="event"><i>✓</i><div><b>Protection active</b><div class="muted">Real-time monitoring is running</div></div></div><div class="event"><i>🔔</i><div><b>Security alert ready</b><div class="muted">${state.alerts} recent notifications</div></div></div><div class="event"><i>↗</i><div><b>Web Guard</b><div class="muted">No unsafe sites detected</div></div></div></div>`,"span4")}
 ${card(`<div class="section-head"><h3>Live camera monitor</h3><span>3 ONLINE</span></div><div class="camera-grid"><div class="camera"><b>Front Door</b><small>● LIVE</small></div><div class="camera"><b>Backyard</b><small>● LIVE</small></div><div class="camera"><b>Garage</b><small>● LIVE</small></div><div class="camera"><b>Living Room</b><small>● LIVE</small></div></div>`,"span8")}
 ${card(`<div class="section-head"><h3>MAX Premium</h3><span>RECOMMENDED</span></div><h2>Protection without limits.</h2><p class="muted">Unlock advanced monitoring, smart alerts and premium controls.</p><button class="primary" onclick="go('plans')">VIEW PLANS</button>`,"span4")}
 </div>`;
}
function monitor(){top("Live Monitor","See connected cameras and device activity.");content.innerHTML+=`<div class="grid">${card(`<div class="section-head"><h3>Camera network</h3><span>3 ONLINE</span></div><div class="camera-grid"><div class="camera"><b>Front Door</b><small>● LIVE</small></div><div class="camera"><b>Backyard</b><small>● LIVE</small></div><div class="camera"><b>Garage</b><small>● LIVE</small></div><div class="camera"><b>Living Room</b><small>● LIVE</small></div></div>`,"span8")}${card(`<h3>Monitor status</h3><div class="statline"><span class="label">Connection</span><b class="green">SECURE</b></div><div class="statline"><span class="label">Cameras</span><b>3 / 3</b></div><div class="statline"><span class="label">Motion alerts</span><b>${state.alerts}</b></div><div class="notice">Camera previews shown here are interface placeholders for the web dashboard.</div>`,"span4")}</div>`}
function alerts(){top("Security Alerts","Review recent activity and notifications.");content.innerHTML+=`<div class="grid">${card(`<div class="event"><i>🔔</i><div><b>Motion detected</b><div class="muted">Front Door · 12 minutes ago</div></div><span class="badge blue">INFO</span></div><div class="event" style="margin-top:10px"><i>🛡</i><div><b>Protection check complete</b><div class="muted">All modules operational · Today</div></div><span class="badge green">SAFE</span></div><div class="event" style="margin-top:10px"><i>🌐</i><div><b>Web Guard active</b><div class="muted">No unsafe domains detected</div></div><span class="badge green">SAFE</span></div>`,"span8")}${card(`<h3>Alert controls</h3><div class="statline"><span class="label">Notifications</span><b class="green">ON</b></div><div class="statline"><span class="label">Motion alerts</span><b class="green">ON</b></div><button class="secondary" onclick="go('settings')">MANAGE SETTINGS</button>`,"span4")}</div>`}
function scan(){top("Scan Center","Check your system for suspicious files and activity.");content.innerHTML+=`<div class="grid">${card(`<div class="shield" style="margin-bottom:15px">⌕</div><h2>Quick Security Scan</h2><p class="muted">Scan common locations and security-sensitive areas.</p><button class="primary" onclick="runScan(this)">START SCAN</button><div id="scanStatus" class="notice">Ready to scan.</div>`,"span6")}${card(`<h3>Scan coverage</h3><div class="statline"><span class="label">System files</span><b>READY</b></div><div class="statline"><span class="label">Downloads</span><b>READY</b></div><div class="statline"><span class="label">Browser data</span><b>READY</b></div><div class="statline"><span class="label">Removable drives</span><b>READY</b></div>`,"span6")}</div>`}
function runScan(btn){btn.disabled=true;btn.textContent="SCANNING…";let s=document.getElementById("scanStatus");let n=0;let t=setInterval(()=>{n+=20;s.textContent="Scanning security areas… "+n+"%";if(n>=100){clearInterval(t);state.scanCount++;btn.disabled=false;btn.textContent="SCAN AGAIN";s.innerHTML='<span class="green"><b>Scan complete.</b></span> No threats detected.'}},160)}
function protection(){top("Protection","Manage the core MAX Security protection layers.");content.innerHTML+=`<div class="grid">${card(`<h3>Real-time Protection</h3><p class="muted">Continuously monitor suspicious activity.</p><div class="statline"><span class="label">Status</span><b class="green">ACTIVE</b></div><button class="secondary" onclick="toggleArm()">TOGGLE</button>`,"span4")}${card(`<h3>Firewall</h3><p class="muted">Protect network traffic and connections.</p><div class="statline"><span class="label">Status</span><b class="green">ACTIVE</b></div><button class="secondary">CONFIGURE</button>`,"span4")}${card(`<h3>Web Guard</h3><p class="muted">Help identify risky links and sites.</p><div class="statline"><span class="label">Status</span><b class="green">ACTIVE</b></div><button class="secondary">OPEN WEB GUARD</button>`,"span4")}</div>`}
function privacy(){top("Security & Privacy","Review the controls that protect your account and device.");content.innerHTML+=`<div class="grid">${card(`<h3>Account security</h3><div class="statline"><span class="label">Session protection</span><b class="green">ON</b></div><div class="statline"><span class="label">Secure sign-in</span><b class="green">ON</b></div><div class="statline"><span class="label">Diagnostics</span><b>OPTIONAL</b></div>`,"span6")}${card(`<h3>Privacy</h3><p class="muted">Choose what MAX Security can use for diagnostics and product improvements.</p><button class="secondary" onclick="go('settings')">PRIVACY SETTINGS</button>`,"span6")}</div>`}
function plans(){top("Plans & Pricing","Simple plans for smarter protection.");content.innerHTML+=`<div class="grid">${plan("Basic","₹199","Essential protection",["Live monitoring","Motion alerts","7-day cloud storage"],"span4")}${plan("Pro","₹399","Advanced security",["Everything in Basic","HD camera quality","30-day cloud storage","Mobile app access"],"span4",true)}${plan("Premium","₹699","Complete peace of mind",["Everything in Pro","Smart AI detection","90-day cloud storage","Priority support"],"span4")}</div><div class="notice">Stripe Checkout is configured separately on the server. Use the payment flow connected to your Stripe Price ID before going live.</div>`}
function plan(name,price,desc,items,cls,pop){return card(`${pop?'<div class="popular">MOST POPULAR</div>':''}<div class="badge ${pop?'blue':'green'}">${name.toUpperCase()}</div><h2 style="margin-top:12px">${desc}</h2><div class="price">${price}<span>/month</span></div><div class="checks">${items.map(x=>`<div class="check">${x}</div>`).join("")}</div><a class="primary" style="display:inline-block;text-decoration:none" href="https://buy.stripe.com/test_dRmbJ105W2sDbUZ9De1kA00" target="_blank" rel="noopener">GET STARTED</a>`,`plan ${pop?'pop ':''}${cls}`)}
function settings(){top("Settings","Configure your MAX Security experience.");content.innerHTML+=`<div class="grid">${card(`<h3>General</h3><div class="statline"><span class="label">Launch at startup</span><b class="green">ON</b></div><div class="statline"><span class="label">Desktop notifications</span><b class="green">ON</b></div><div class="statline"><span class="label">Automatic updates</span><b class="green">ON</b></div>`,"span6")}${card(`<h3>Subscription</h3><div class="statline"><span class="label">Current plan</span><b>${state.plan}</b></div><div class="statline"><span class="label">Payment</span><b>Stripe Checkout</b></div><button class="secondary" onclick="go('plans')">MANAGE PLAN</button>`,"span6")}</div>`}
function toggleArm(){state.armed=!state.armed;go(state.page)}
go("dashboard");
</script>
</body></html>
